[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-assistant"
version = "0.1.0"
description = "Multi-agent technical assistant for pool technicians (Fluidra GenAI assessment)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pool-assistant = "pool_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
