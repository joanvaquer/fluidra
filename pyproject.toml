[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-assistant"
version = "0.1.0"
description = "Multi-agent technical assistant for pool technicians (Fluidra GenAI assessment)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "shiny>=1.4,<2",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pool-assistant = "pool_assistant.cli:main"
pool-assistant-web = "pool_assistant.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
