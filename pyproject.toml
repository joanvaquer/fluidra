[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pool-assistant"
version = "0.1.0"
description = "Multi-agent technical assistant for pool technicians (Fluidra GenAI assessment)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "shiny>=1.4,<2",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pool-assistant = "pool_assistant.cli:main"
pool-assistant-web = "pool_assistant.webapp:main"

# the package is the pool_assistant/ folder (hatchling installs it without an .egg-info folder)
[tool.hatch.build.targets.wheel]
packages = ["pool_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
